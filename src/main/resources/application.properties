spring.application.name=finflow


server.port=8096

# JWT Secret
jwt.secret=mysecretkeymysecretkeymysecretkey123
jwt.expiry.milliseconds=3600000

# H2 Database
spring.datasource.url=jdbc:h2:mem:finflow-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=finflow

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

resilience4j.retry.instances.otpRetry.max-attempts=3
resilience4j.retry.instances.otpRetry.wait-duration=1s